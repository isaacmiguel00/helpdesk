name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 13 * * *'   # todos los días 13:17 UTC (07:17 hora de Durango)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta diaria a la base de datos
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SB_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "Respuesta HTTP: $code"
          [ "$code" = "200" ]
