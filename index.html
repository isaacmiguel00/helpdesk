 $('#dlg').innerHTML=`<h3>${k?'Editar':'Nuevo'} usuario</h3><div style="display:flex;gap:12px;align-items:center">${av(u,56)}<div style="flex:1"><label>Foto de perfil (se reduce a 160×160, máx. 5 MB)</label><input id="uf" type="file" accept="image/*"></div></div><label>Correo</label><input id="uu" type="email" value="${esc(u.email)}"><label>Nombre</label><input id="un" value="${esc(u.n)}"><label>Rol</label><select id="ur">${ro.map(x=>`<option value="${x[0]}" ${u.r==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><label>Estado</label><select id="ua"><option value="1" ${u.a?'selected':''}>Activo</option><option value="0" ${u.a?'':'selected'}>Deshabilitado</option></select>
 ${k?'<p class="s"><i class="bi bi-lock"></i> La contraseña solo la puede cambiar cada usuario.</p>':'<label>Contraseña inicial (mín. 8)</label><input id="up" type="password">'}
 <div class="row" style="margin-top:12px"><button class="btn o" onclick="$('#dlg').close()">Cancelar</button><button class="btn" onclick="usave('${k||''}')">Guardar</button></div>`;$('#dlg').showModal()}
async function usave(k){if(!M())return;const n=$('#un').value.trim(),r=$('#ur').value,a=$('#ua').value==='1',em=$('#uu').value.trim().toLowerCase();let id=k,foto;
 if(r==='master'&&!MS())return alert('Solo el MASTER puede asignar el rol MASTER');if(!em)return alert('El correo es obligatorio');
 if(k===U.id&&(r!==U.r||!a))return alert('No puedes cambiar tu propio rol ni deshabilitarte');
 try{const f=$('#uf').files[0];if(f)foto=await avatar(f)}catch(x){return alert('Error: '+x.message)}
 if(!k){const p=$('#up').value;if(p.length<8)return alert('Contraseña mínima de 8 caracteres');
  const {data,error}=await sb2.auth.signUp({email:em,password:p,options:{data:{n:n||em}}});if(error)return alert(errT(error));id=data.user.id}
 else{const cur=(await sb.from('profiles').select('email').eq('id',k).single()).data;if(cur.email!==em){const {error}=await sb.rpc('admin_email',{uid:k,em});if(error)return alert('Error: '+error.message)}}
 const {error}=await sb.from('profiles').update({n:n||em,r,a,...(foto?{foto}:{})}).eq('id',id);if(error)return alert('Error: '+error.message);$('#dlg').close();toast('Usuario guardado');users()}
/* ---------- Almacenamiento + exportación (MASTER) ---------- */
function xls(rows,name){const h=Object.keys(rows[0]||{ID:1});const b=new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body><table border="1"><tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+h.map(x=>`<td>${esc(r[x])}</td>`).join('')+'</tr>').join('')+'</table></body></html>'],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.xls';a.click()}
const flat=t=>({ID:t.id,Tipo:t.t,Título:t.ti,Descripción:t.d,...Object.fromEntries(CF.map(c=>[c.nombre,(t.cats||{})[c.nombre]||(c.nombre==='Categoría'?t.k:'')||''])),Canal:t.canal||'',Reporta:t.rep||'','Teléfono':t.tel||'',Prioridad:t.p,Estado:t.e,'Creado por':t.por,'Fecha creación':fd(t.c),'Fecha cierre':fd(t.cl),'Horas resolución':t.cl?((t.cl-t.c)/36e5).toFixed(1):'',Adjuntos:t.m,Historial:(t.h||[]).map(h=>`${fd(h.f)} ${h.u}: ${h.a}`).join(' | ')});
const olds=async()=>(await tk()).filter(t=>t.cl&&t.cl<Date.now()-30*864e5);
async function store(){if(!M())return;const {data:u}=await sb.rpc('uso'),T=await tk(),old=T.filter(t=>t.cl&&t.cl<Date.now()-30*864e5),L=[['Base de datos',u.db,500*1048576],['Archivos (imágenes/videos)',u.files,1024*1048576]],mg=x=>(x/1048576).toFixed(1)+' MB',hi=L.some(l=>l[1]/l[2]>.7);
 $('#v').innerHTML=`${hi||old.length?`<div class="warn"><i class="bi bi-exclamation-triangle-fill"></i> ${hi?'Almacenamiento arriba del 70 %. ':''}${old.length?`Hay ${old.length} ticket(s) cerrados con más de 30 días. `:''}Exporta el histórico y depura.</div>`:''}
 <div class="card"><b>Espacio del plan gratuito de Supabase</b>${L.map(l=>`<div style="margin:12px 0"><div class="s">${l[0]}: ${mg(l[1])} de ${mg(l[2])} (${(l[1]/l[2]*100).toFixed(1)}%)</div><div class="pb"><i style="width:${Math.min(100,l[1]/l[2]*100)}%"></i></div></div>`).join('')}<div class="s">Tickets: ${T.length}</div></div>
 <div class="card"><b>Depuración</b><p class="s">Tickets cerrados con más de 30 días: <b>${old.length}</b>. El Excel incluye todos los datos e historial (sin imágenes ni videos).</p><div class="row"><button class="btn o" onclick="xls(TC.map(flat),'historico_total')"><i class="bi bi-file-earmark-excel"></i>Exportar todo a Excel</button><button class="btn o" onclick="expOld()"><i class="bi bi-file-earmark-spreadsheet"></i>Exportar >30 días</button><button class="btn r" onclick="purge()"><i class="bi bi-trash3-fill"></i>Vaciar >30 días</button></div></div>`;TC=T}
async function expOld(){const o=await olds();if(!o.length)return alert('Nada que exportar');xls(o.map(flat),'historico_30dias_'+new Date().toISOString().slice(0,10));OK=1}
async function purge(){if(!M())return;const o=await olds();if(!o.length)return alert('No hay registros mayores a 30 días');
 if(!OK&&!confirm('Aún no exportaste el histórico a Excel. ¿Continuar de todos modos?'))return;if(!confirm(`Se descargará un ZIP con los adjuntos y luego se borrarán ${o.length} tickets de forma permanente. ¿Continuar?`))return;
 const ids=o.map(t=>t.id),{data:ms}=await sb.from('media').select('*').in('tid',ids);
 if(ms.length){if(!window.JSZip)return alert('Error: no cargó la librería ZIP. Revisa tu internet');const z=new JSZip();let i=0;
  try{for(const m of ms){if(++i%5===1)toast(`Descargando adjuntos ${i}/${ms.length}…`);const {data:b,error}=await sb.storage.from(BK).download(m.path);if(error)throw error;z.file(`ticket_${m.tid}/${m.id}_${(m.n||'archivo').replace(/\.[^.]+$/,'').replace(/[^\w.-]+/g,'_')}.${m.path.split('.').pop()}`,b)}}catch(x){return alert('Error: no se pudo descargar un adjunto; no se borró nada. '+(x.message||''))}
  const blob=await z.generateAsync({type:'blob',compression:'STORE'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='adjuntos_'+new Date().toISOString().slice(0,10)+'.zip';a.click();
  if(!confirm('¿Se descargó bien el ZIP? Pulsa Aceptar para borrar los registros.'))return}
 for(let i=0;i<ms.length;i+=100)await sb.storage.from(BK).remove(ms.slice(i,i+100).map(m=>m.path));
 await sb.from('tickets').delete().in('id',ids);OK=0;toast('Registros depurados');store()}
boot();
</script></body></html>
