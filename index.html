async function forgot(){const e=$('#lu').value.trim();if(!e)return alert('Escribe tu correo arriba');await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});alert('Si el correo existe, recibirás un enlace para restablecer.')}

async function chpw(){const p=prompt('Nueva contraseña (mín. 8 caracteres):');if(!p)return;if(p.length<8)return alert('Mínimo 8');const {error}=await sb.auth.updateUser({password:p});alert(error?error.message:'Contraseña actualizada')}
/* ---------- Shell ---------- */
function shell(){document.documentElement.dataset.t=th();
 const nav=[['dash','<i class="bi bi-speedometer2"></i>Dashboard'],['list','<i class="bi bi-ticket-detailed"></i>Tickets'],...(M()?[['users','<i class="bi bi-people"></i>Usuarios'],['store','<i class="bi bi-hdd-stack"></i>Almacenamiento']]:[])];
 $('#app').innerHTML=`<header><b><i class="bi bi-headset"></i> TV Helpdesk ${TH[th()][1]}</b><nav>${nav.map(n=>`<button id="n_${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav>
 <select onchange="localStorage['tvt_'+U.id]=this.value;shell()">${Object.entries(TH).map(([k,v])=>`<option value="${k}" ${k==th()?'selected':''}>${v[0]}</option>`).join('')}</select>
 <span>${esc(U.n)} (${M()?'MASTER':'Usuario'})</span><button class="hb" title="Cambiar mi contraseña" onclick="chpw()"><i class="bi bi-key"></i></button><button class="hb" onclick="logout()"><i class="bi bi-box-arrow-right"></i>Salir</button></header><main id="v"></main><footer>Diseñado por TECHNOVARUM</footer>`;go(V)}
async function go(v){V=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='n_'+v));await({dash,list,users,store}[v]||dash)()}
/* ---------- Dashboard ---------- */
const cnt=(a,f)=>a.reduce((o,x)=>(o[f(x)]=(o[f(x)]||0)+1,o),{});
const bar=(t,o,order)=>{const ks=order||Object.keys(o),mx=Math.max(1,...ks.map(k=>o[k]||0));return`<div class="card"><b>${t}</b>${ks.map(k=>`<div class="br"><span>${esc(k)}</span><i style="width:${(o[k]||0)/mx*60}%"></i><span>${o[k]||0}</span></div>`).join('')}</div>`};
async function dash(){const T=await tk(),cl=T.filter(t=>t.cl),av=cl.length?cl.reduce((s,t)=>s+(t.cl-t.c),0)/cl.length/36e5:0,
 dl=x=>new Date(x).toLocaleDateString('es-MX',{day:'2-digit',month:'short'}),d7=[...Array(7)].map((_,i)=>dl(Date.now()-(6-i)*864e5)),c7=cnt(T,t=>dl(t.c));
 $('#v').innerHTML=`<div class="grid">${[['Total',T.length,'collection'],['Abiertos',T.filter(t=>t.e==='Abierto').length,'inbox'],['En proceso',T.filter(t=>t.e==='En proceso').length,'hourglass-split'],['Cerrados',cl.length,'check2-circle'],['Resolución prom.',av.toFixed(1)+' h','stopwatch'],['Críticos activos',T.filter(t=>t.p==='Crítica'&&!t.cl).length,'lightning-charge-fill']].map(k=>`<div class="card"><i class="bi bi-${k[2]} ki"></i><div class="k">${k[1]}</div><div class="s">${k[0]}</div></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${bar('Por estado',cnt(T,t=>t.e),['Abierto','En proceso','Cerrado'])}${bar('Por prioridad',cnt(T,t=>t.p),['Crítica','Alta','Media','Baja'])}${bar('Por tipo',cnt(T,t=>t.t))}${bar('Por categoría',cnt(T,t=>t.k))}${bar('Últimos 7 días',c7,d7)}${bar('Por usuario',cnt(T,t=>t.por))}</div>`}
/* ---------- Tickets ---------- */
const PR=['Baja','Media','Alta','Crítica'],ES=['Abierto','En proceso','Cerrado'],CA=['Hardware','Software','Red','Accesos','Mantenimiento','Otro'];
async function list(){TC=await tk();$('#v').innerHTML=`<div class="card"><div class="row"><input placeholder="Buscar ticket…" value="${esc(F.q)}" oninput="F.q=this.value;rows()"><select onchange="F.e=this.value;rows()"><option value="">Todos los estados</option>${ES.map(e=>`<option ${F.e==e?'selected':''}>${e}</option>`).join('')}</select><select onchange="F.t=this.value;rows()"><option value="">Todos los tipos</option>${['Incidencia','Requerimiento'].map(e=>`<option ${F.t==e?'selected':''}>${e}</option>`).join('')}</select><button class="btn" onclick="form()"><i class="bi bi-plus-lg"></i>Nuevo ticket</button></div></div><div class="card tw"><table><thead><tr><th>#</th><th>Tipo</th><th>Título</th><th>Prioridad</th><th>Estado</th><th>Creó</th><th>Fecha</th><th><i class="bi bi-paperclip"></i></th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;rows()}
function rows(){const q=F.q.toLowerCase(),T=TC.filter(t=>(!F.e||t.e===F.e)&&(!F.t||t.t===F.t)&&(!q||(t.ti+t.d+t.por+t.id).toLowerCase().includes(q)));
 $('#tb').innerHTML=T.map(t=>`<tr><td class="mono">#${t.id}</td><td>${t.t}</td><td>${esc(t.ti)}</td><td class="${t.p}">${t.p}</td><td class="${t.e=='Cerrado'?'Cerrado':''}">${t.e}</td><td>${esc(t.por)}</td><td>${fd(t.c)}</td><td>${t.m?`<button class="btn o" onclick="show(${t.id})"><i class="bi bi-paperclip"></i>${t.m}</button>`:''}</td><td style="white-space:nowrap"><button class="btn o" title="${t.e=='Cerrado'&&!M()?'Ver':'Editar'}" onclick="form(${t.id})"><i class="bi bi-${t.e=='Cerrado'&&!M()?'eye':'pencil-square'}"></i></button>${M()?` <button class="btn r" title="Eliminar" onclick="rm(${t.id})"><i class="bi bi-trash3"></i></button>`:''}</td></tr>`).join('')||'<tr><td colspan=9>Sin registros</td></tr>'}
async function form(id){const t=id?(await sb.from('tickets').select('*').eq('id',id).single()).data:{t:'Incidencia',p:'Media',e:'Abierto',k:'Otro',ti:'',d:'',h:[]},ro=t.e==='Cerrado'&&!M(),sel=(n,a,v)=>`<select id="${n}" ${ro?'disabled':''}>${a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 $('#dlg').innerHTML=`<h3>${id?'Ticket #'+id:'Nuevo ticket'}</h3>${ro?'<p class="warn">Ticket cerrado: solo el MASTER puede modificarlo.</p>':''}<div class="row"><div><label>Tipo</label>${sel('ft',['Incidencia','Requerimiento'],t.t)}</div><div><label>Prioridad</label>${sel('fp',PR,t.p)}</div><div><label>Categoría</label>${sel('fk',CA,t.k)}</div><div><label>Estado</label>${sel('fe',M()?ES:ES.slice(0,2).concat(t.e=='Cerrado'?['Cerrado']:[]),t.e)}</div></div>
 <label>Título</label><input id="fti" maxlength="120" value="${esc(t.ti)}" ${ro?'disabled':''}><label>Descripción</label><textarea id="fd" rows="4" maxlength="2000" ${ro?'disabled':''}>${esc(t.d)}</textarea>
 ${ro?'':`<label>Nota de seguimiento</label><input id="fn" maxlength="300"><label>Imágenes (máx 10 MB) o videos (se comprimen a ≤16 MB)</label><input id="ff" type="file" accept="image/*,video/*" multiple>`}
 <p id="fs" class="s"></p>${id?`<details><summary>Historial</summary>${(t.h||[]).map(h=>`<div class="s">${fd(h.f)} · ${esc(h.u)}: ${esc(h.a)}</div>`).join('')}</details>`:''}
 <div class="row" style="margin-top:12px"><button class="btn o" onclick="$('#dlg').close()">Cerrar</button>${ro?'':`<button class="btn" id="sv" onclick="save(${id||0})">Guardar</button>`}</div>`;$('#dlg').showModal()}
async function save(id){const old=id?(await sb.from('tickets').select('*').eq('id',id).single()).data:null,e=$('#fe').value,ti=$('#fti').value.trim();
 if(e==='Cerrado'&&!M())return alert('Solo el MASTER puede cerrar tickets');if(!ti)return alert('Escribe un título');
 const row={t:$('#ft').value,p:$('#fp').value,k:$('#fk').value,ti,d:$('#fd').value.trim(),e,u:Date.now(),cl:e==='Cerrado'?(old?.cl||Date.now()):null,
  h:[...(old?.h||[]),{f:Date.now(),u:U.n,a:!old?'Ticket creado':(old.e!==e?`Estado: ${old.e} → ${e}`:'Editado')+($('#fn').value?'. '+$('#fn').value:'')}]};
 $('#sv').disabled=1;if(!old)Object.assign(row,{c:Date.now(),por:U.n,m:0});
 const r=old?await sb.from('tickets').update(row).eq('id',id).select().single():await sb.from('tickets').insert(row).select().single();
 if(r.error){$('#sv').disabled=0;return alert(r.error.message)}let t=r.data,n=t.m;
 try{for(const f of $('#ff').files){$('#fs').textContent='Procesando '+f.name+'…';const b=f.type.startsWith('video')?await vid(f):await img(f),path=`${t.id}/${crypto.randomUUID()}.${b.type.split('/')[1]}`;
  $('#fs').textContent='Subiendo '+f.name+'…';const u=await sb.storage.from(BK).upload(path,b,{contentType:b.type});if(u.error)throw u.error;
  await sb.from('media').insert({tid:t.id,path,type:b.type,n:f.name,size:b.size});n++}}catch(x){alert(x.message)}
 if(n!==t.m)await sb.from('tickets').update({m:n}).eq('id',t.id);$('#dlg').close();go(V)}
async function img(f){if(!f.type.startsWith('image/'))throw Error('Formato no válido: '+f.name);if(f.size>10485760)throw Error(f.name+' supera 10 MB');
 const bm=await createImageBitmap(f),s=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*s;c.height=bm.height*s;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
async function vid(f){if(f.size<=16e6&&f.type==='video/webm'||f.size<=3e6)return f;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(f);
 await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(Error('No se pudo leer '+f.name))});if(v.duration>180)throw Error(f.name+': máximo 3 minutos');
 const sc=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc/2)*2;c.height=Math.round(v.videoHeight*sc/2)*2;const x=c.getContext('2d'),ch=[],mr=new MediaRecorder(c.captureStream(24),{mimeType:'video/webm',videoBitsPerSecond:600000});
 mr.ondataavailable=e=>ch.push(e.data);const dn=new Promise(r=>mr.onstop=r);mr.start();await v.play();
 await new Promise(r=>{v.onended=r;(function d(){x.drawImage(v,0,0,c.width,c.height);$('#fs').textContent=`Comprimiendo video… ${Math.round(v.currentTime/v.duration*100)}%`;if(!v.ended)requestAnimationFrame(d)})()});
 mr.stop();await dn;URL.revokeObjectURL(v.src);const b=new Blob(ch,{type:'video/webm'});if(b.size>16e6)throw Error(f.name+' sigue >16 MB tras comprimir');return b}
async function show(id){const {data:ms}=await sb.from('media').select('*').eq('tid',id),{data:us}=await sb.storage.from(BK).createSignedUrls(ms.map(m=>m.path),3600);
 $('#dlg').innerHTML=`<h3>Adjuntos del ticket #${id}</h3><div class="md">${ms.map((m,i)=>{const u=us[i].signedUrl;return m.type.startsWith('video')?`<video src="${u}" controls></video>`:`<a href="${u}" target="_blank"><img src="${u}" alt=""></a>`}).join('')}</div><button class="btn o" onclick="$('#dlg').close()">Cerrar</button>`;$('#dlg').showModal()}
async function rm(id){if(!M()||!confirm('¿Eliminar ticket #'+id+' y sus adjuntos?'))return;const {data:ms}=await sb.from('media').select('path').eq('tid',id);if(ms.length)await sb.storage.from(BK).remove(ms.map(m=>m.path));await sb.from('tickets').delete().eq('id',id);go(V)}
/* ---------- Usuarios (MASTER) ---------- */
async function users(){if(!M())return;const {data:us}=await sb.from('profiles').select('*').order('email');
 $('#v').innerHTML=`<div class="card"><button class="btn" onclick="uform()"><i class="bi bi-person-plus"></i>Nuevo usuario</button></div><div class="card tw"><table><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr>${us.map(u=>`<tr style="${u.a?'':'opacity:.55'}"><td>${esc(u.email)}</td><td>${esc(u.n)}</td><td>${u.r==='master'?'<i class="bi bi-shield-check"></i> MASTER':'<i class="bi bi-person"></i> Usuario'}</td><td>${u.a?'<span class="Cerrado"><i class="bi bi-check-circle-fill"></i> Activo</span>':'<i class="bi bi-slash-circle"></i> Deshabilitado'}</td><td style="white-space:nowrap"><button class="btn o" title="Editar" onclick="uform('${u.id}')"><i class="bi bi-pencil-square"></i></button> ${u.id!==U.id?`<button class="btn ${u.a?'r':''}" title="${u.a?'Deshabilitar':'Habilitar'}" onclick="utog('${u.id}',${!u.a})"><i class="bi bi-${u.a?'person-slash':'person-check'}"></i></button>`:''}</td></tr>`).join('')}</table></div>`}
async function utog(id,a){if(!M()||id===U.id)return;if(!confirm(a?'¿Habilitar este usuario?':'¿Deshabilitar este usuario? Perderá el acceso de inmediato.'))return;const {error}=await sb.from('profiles').update({a}).eq('id',id);if(error)alert(error.message);users()}
async function uform(k){const u=k?(await sb.from('profiles').select('*').eq('id',k).single()).data:{email:'',n:'',r:'user',a:true};$('#dlg').innerHTML=`<h3>${k?'Editar':'Nuevo'} usuario</h3><label>Correo</label><input id="uu" type="email" value="${esc(u.email)}"><label>Nombre</label><input id="un" value="${esc(u.n)}"><label>Rol</label><select id="ur"><option value="user" ${u.r=='user'?'selected':''}>Usuario (registra y edita)</option><option value="master" ${u.r=='master'?'selected':''}>MASTER (administrador)</option></select><label>Estado</label><select id="ua"><option value="1" ${u.a?'selected':''}>Activo</option><option value="0" ${u.a?'':'selected'}>Deshabilitado</option></select>
 ${k?'<p class="s"><i class="bi bi-lock"></i> La contraseña solo la puede cambiar cada usuario.</p>':'<label>Contraseña inicial (mín. 8)</label><input id="up" type="password">'}
 <div class="row" style="margin-top:12px"><button class="btn o" onclick="$('#dlg').close()">Cancelar</button><button class="btn" onclick="usave('${k||''}')">Guardar</button></div>`;$('#dlg').showModal()}
async function usave(k){if(!M())return;const n=$('#un').value.trim(),r=$('#ur').value,a=$('#ua').value==='1',em=$('#uu').value.trim().toLowerCase();let id=k;
 if(!em)return alert('El correo es obligatorio');if(k===U.id&&(r!=='master'||!a))return alert('No puedes quitarte tu propio acceso');
 if(!k){const p=$('#up').value;if(p.length<8)return alert('Contraseña mínima de 8 caracteres');
  const {data,error}=await sb2.auth.signUp({email:em,password:p,options:{data:{n:n||em}}});if(error)return alert(error.message);id=data.user.id}
 else{const cur=(await sb.from('profiles').select('email').eq('id',k).single()).data;if(cur.email!==em){const {error}=await sb.rpc('admin_email',{uid:k,em});if(error)return alert(error.message)}}
 const {error}=await sb.from('profiles').update({n:n||em,r,a}).eq('id',id);if(error)return alert(error.message);$('#dlg').close();users()}
/* ---------- Almacenamiento + exportación (MASTER) ---------- */
function xls(rows,name){const h=Object.keys(rows[0]||{ID:1});const b=new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body><table border="1"><tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+h.map(x=>`<td>${esc(r[x])}</td>`).join('')+'</tr>').join('')+'</table></body></html>'],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.xls';a.click()}
const flat=t=>({ID:t.id,Tipo:t.t,Título:t.ti,Descripción:t.d,Categoría:t.k,Prioridad:t.p,Estado:t.e,'Creado por':t.por,'Fecha creación':fd(t.c),'Fecha cierre':fd(t.cl),'Horas resolución':t.cl?((t.cl-t.c)/36e5).toFixed(1):'',Adjuntos:t.m,Historial:(t.h||[]).map(h=>`${fd(h.f)} ${h.u}: ${h.a}`).join(' | ')});
const olds=async()=>(await tk()).filter(t=>t.cl&&t.cl<Date.now()-30*864e5);
async function store(){if(!M())return;const {data:u}=await sb.rpc('uso'),T=await tk(),old=T.filter(t=>t.cl&&t.cl<Date.now()-30*864e5),L=[['Base de datos',u.db,500*1048576],['Archivos (imágenes/videos)',u.files,1024*1048576]],mg=x=>(x/1048576).toFixed(1)+' MB',hi=L.some(l=>l[1]/l[2]>.7);
 $('#v').innerHTML=`${hi||old.length?`<div class="warn"><i class="bi bi-exclamation-triangle-fill"></i> ${hi?'Almacenamiento arriba del 70 %. ':''}${old.length?`Hay ${old.length} ticket(s) cerrados con más de 30 días. `:''}Exporta el histórico y depura.</div>`:''}
 <div class="card"><b>Espacio del plan gratuito de Supabase</b>${L.map(l=>`<div style="margin:12px 0"><div class="s">${l[0]}: ${mg(l[1])} de ${mg(l[2])} (${(l[1]/l[2]*100).toFixed(1)}%)</div><div class="pb"><i style="width:${Math.min(100,l[1]/l[2]*100)}%"></i></div></div>`).join('')}<div class="s">Tickets: ${T.length}</div></div>
 <div class="card"><b>Depuración</b><p class="s">Tickets cerrados con más de 30 días: <b>${old.length}</b>. El Excel incluye todos los datos e historial (sin imágenes ni videos).</p><div class="row"><button class="btn o" onclick="xls(TC.map(flat),'historico_total')"><i class="bi bi-file-earmark-excel"></i>Exportar todo a Excel</button><button class="btn o" onclick="expOld()"><i class="bi bi-file-earmark-spreadsheet"></i>Exportar >30 días</button><button class="btn r" onclick="purge()"><i class="bi bi-trash3-fill"></i>Vaciar >30 días</button></div></div>`;TC=T}
async function expOld(){const o=await olds();if(!o.length)return alert('Nada que exportar');xls(o.map(flat),'historico_30dias_'+new Date().toISOString().slice(0,10));OK=1}
async function purge(){if(!M())return;const o=await olds();if(!o.length)return alert('No hay registros mayores a 30 días');
 if(!OK&&!confirm('Aún no exportaste el histórico. ¿Borrar de todos modos?'))return;if(!confirm(`Se borrarán ${o.length} tickets y sus adjuntos de forma permanente. ¿Continuar?`))return;
 const ids=o.map(t=>t.id),{data:ms}=await sb.from('media').select('path').in('tid',ids);for(let i=0;i<ms.length;i+=100)await sb.storage.from(BK).remove(ms.slice(i,i+100).map(m=>m.path));
 await sb.from('tickets').delete().in('id',ids);OK=0;store()}
boot();
</script></body></html>
